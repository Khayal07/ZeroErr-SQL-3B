[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroerr"
version = "0.1.0"
description = "ZeroErr-SQL-3B: Execution-guided Text-to-SQL small language model with a self-correction guardrail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khayal Sadigov" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "datasets>=2.19",
    "pandas>=2.0",
    "rich>=13.7",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "unsloth",
    "trl>=0.9",
    "accelerate>=0.33",
    "xformers; platform_system == 'Linux'",
]
local = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.9",
    "accelerate>=0.33",
    "bitsandbytes>=0.43; platform_system == 'Windows'",
    "sentencepiece",
    "protobuf",
    "gguf",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
zeroerr-bench = "zeroerr.eval.run_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"